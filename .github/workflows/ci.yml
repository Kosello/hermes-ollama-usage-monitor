name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          python -m py_compile backend/dashboard/plugin_api.py
          python -m py_compile tests/test_parser.py

      - name: Parser smoke test
        run: python tests/test_parser.py

      - name: Node syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check desktop/plugin.js
